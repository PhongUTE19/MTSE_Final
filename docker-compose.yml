services:
  server:
    image: spendwise-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: spendwise-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.60}
      - TOP_K=${TOP_K:-3}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-spendwise}
      - KNOWLEDGE_DIR=/app/data/knowledge
      - PROMPT_FILE=/app/data/system_prompt.txt
      - PROMPT_FILE_DEFAULT=/app/data/prompts/system_prompt_default.txt
    volumes:
      - ./data:/app/data

  client:
    image: spendwise-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: spendwise-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_started
